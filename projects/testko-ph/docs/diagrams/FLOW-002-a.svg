<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="606" viewBox="0 0 1380 606" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="FLOW-002 — Sign-in swimlane">
